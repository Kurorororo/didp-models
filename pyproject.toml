[project]
name = "didp-models"
version = "0.11.1"
description = "DIDPPy and YAML-DyPDL benchmark models"
requires-python = ">=3.10"
dependencies = ["didppy==0.11.1", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["ruff==0.16.8"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".private", "**/TestInstancesAndResults", "**/reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP032"]
