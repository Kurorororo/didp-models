objects:
  - scene
  - actor
state_variables:
  - name: remaining
    type: set
    object: scene
tables:
  - name: players
    type: set
    object: actor
    args:
      - scene
  - name: duration
    type: integer
    args:
      - scene
  - name: actor_cost
    type: integer
    args:
      - actor
  - name: base_cost
    type: integer
    args:
      - scene
  - name: subsumption_candidates
    type: set
    object: scene
    args:
      - scene
state_functions:
  - name: came
    type: set
    expression: (union players ~remaining)
  - name: standby
    type: set
    expression: (intersection came (union players remaining))
transition_dominance:
  - dominating:
      name: shoot
      parameters:
        - name: t
          object: scene
    dominated:
      name: shoot
      parameters:
        - name: s
          object: scene
    conditions:
      - (is_in t (subsumption_candidates s))
      - (or (< t s) (not (is_in s (subsumption_candidates t))))
      - (is_subset (players t) (union came (players s)))
base_cases:
  - - (is_empty remaining)
reduce: min
cost_type: integer
transitions:
  - name: actor-equivalent-shoot
    forced: true
    parameters:
      - name: s
        object: remaining
    preconditions:
      - (= (players s) standby)
    effect:
      remaining: (remove s remaining)
    cost: (+ cost (base_cost s))
  - name: shoot
    parameters:
      - name: s
        object: remaining
    effect:
      remaining: (remove s remaining)
    cost: (+ cost (* (duration s) (sum actor_cost (union (players s) standby))))
dual_bounds:
  - (sum base_cost remaining)
