domain: OPTW
objects:
- node
reduce: max
cost_type: integer
state_variables:
- name: reachable
  type: set
  object: node
  preference: greater
- name: location
  type: element
  object: node
- name: time
  type: integer
  preference: less
tables:
- name: goal
  type: element
  object: node
- name: epsilon
  type: continuous
- name: profit
  type: integer
  args:
  - node
- name: reward
  type: integer
  args:
  - node
- name: opening
  type: integer
  args:
  - node
- name: closing
  type: integer
  args:
  - node
- name: min_from
  type: integer
  args:
  - node
- name: min_to
  type: integer
  args:
  - node
- name: shortest_return
  type: integer
  args:
  - node
- name: travel
  type: integer
  args:
  - node
  - node
- name: shortest
  type: integer
  args:
  - node
  - node
state_functions:
- name: time_next
  type: integer
  parameters:
  - name: to
    object: node
  expression: (max (+ time (travel location to)) (opening to))
constraints:
- condition: (<= time (closing 0))
base_cases:
- - (= location goal)
transitions:
- name: visit
  parameters:
  - name: to
    object: reachable
  cost: (+ cost (profit to))
  preconditions:
  - (!= location goal)
  - (<= (time_next to) (closing to))
  - (<= (+ (time_next to) (shortest_return to)) (closing 0))
  effect:
    location: to
    time: (time_next to)
    reachable: (filter x (remove to reachable) (and (<= (max (+ (time_next to) (shortest to x)) (opening
      x)) (closing x)) (<= (+ (max (+ (time_next to) (shortest to x)) (opening x)) (shortest_return x))
      (closing 0))))
- name: finish
  cost: cost
  effect:
    location: goal
    time: (+ time (travel location 0))
    reachable: (node)
  preconditions:
  - (!= location goal)
  - (<= (+ time (travel location 0)) (closing 0))
